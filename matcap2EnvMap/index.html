<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
        <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" rel="stylesheet"/>
        <link rel="icon" type="image/x-icon" href="../styles/dih.ico">
        <link href="../styles/style.css" rel="stylesheet"/>
        <link href="../styles/foundation-icons.css" rel="stylesheet">
        <title>DIH - Matcap to EnvMap</title>
        <style>
            #facesOutput {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
                margin-top: 10px;
            }
            #facesOutput .face-cell {
                text-align: center;
            }
            #facesOutput canvas {
                width: 100%;
                border-radius: 6px;
                background: #000;
            }
            #facesOutput span {
                display: block;
                font-size: 12px;
                color: #888;
                margin-top: 4px;
            }
            #vmtPreview {
                background-color: #f0f0f0;
                border-radius: 6px;
                padding: 14px;
                font-size: 13px;
                text-align: left;
                white-space: pre-wrap;
                overflow-x: auto;
            }
            .note-text {
                font-size: 13px;
                color: #666;
                text-align: left;
            }
        </style>
    </head>
    <body>
        <div class="container animated-block text-center py-4">
            <div id="drop-area">
                <div>
                    <h2>Matcap → Source EnvMap (VTF/VMT)</h2>
                    <p class="mb-3">Unwraps a matcap sphere into a 6-face cubemap and builds a ready .vtf + .vmt. Runs entirely in your browser.</p>
                    <input accept="image/*" class="form-control form-control-lg" id="imageInput" type="file">
                </div>
            </div>

            <div class="row g-3">
                <!-- Face Size -->
                <div class="col-md-4">
                    <div id="settings-area" class="p-3 border rounded bg-light h-100">
                        <h3>Face size</h3>
                        <fieldset title="Size of each of the 6 cubemap faces.">
                            <div class="btn-group w-100" role="group">
                                <input class="btn-check" id="size-256" name="faceSize" type="radio" value="256">
                                <label class="btn btn-outline-primary" for="size-256">256</label>

                                <input checked class="btn-check" id="size-512" name="faceSize" type="radio" value="512">
                                <label class="btn btn-outline-primary" for="size-512">512</label>

                                <input class="btn-check" id="size-1024" name="faceSize" type="radio" value="1024">
                                <label class="btn btn-outline-primary" for="size-1024">1024</label>
                            </div>
                        </fieldset>
                    </div>
                </div>

                <!-- Compression / Format -->
                <div class="col-md-4">
                    <div id="settings-area" class="p-3 border rounded bg-light h-100">
                        <h3>Compression</h3>
                        <fieldset title="VTF pixel compression format.">
                            <div class="btn-group w-100" role="group">
                                <input checked class="btn-check" id="fmt-dxt1" name="pixelFormat" type="radio" value="DXT1">
                                <label class="btn btn-outline-primary" for="fmt-dxt1">DXT1</label>

                                <input class="btn-check" id="fmt-bgr888" name="pixelFormat" type="radio" value="BGR888">
                                <label class="btn btn-outline-primary" for="fmt-bgr888">BGR888</label>
                            </div>
                        </fieldset>
                    </div>
                </div>

                <!-- Orientation / Flip -->
                <div class="col-md-4">
                    <div id="settings-area" class="p-3 border rounded bg-light h-100">
                        <h3>Orientation</h3>
                        <fieldset title="Vertical row flipping options.">
                            <div class="btn-group w-100" role="group">
                                <input checked class="btn-check" id="flip-none" name="flipRows" type="radio" value="false">
                                <label class="btn btn-outline-primary" for="flip-none">Normal</label>

                                <input class="btn-check" id="flip-vertical" name="flipRows" type="radio" value="true">
                                <label class="btn btn-outline-primary" for="flip-vertical">Flip rows</label>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>

            <br>

            <div id="drop-area">
                <button class="btn btn-primary btn-lg" id="generateBtn" disabled>Generate</button>
                <p id="status" class="mt-2 mb-0 note-text"></p>
            

                <div id="resultArea" class="drop-area2" style="display:none">
                    <h3>Cubemap faces</h3>
                    <output id="facesOutput"></output>

                    <div class="d-flex gap-2 justify-content-center flex-wrap mt-3 mb-3">
                        <button class="btn btn-success" id="dlVtf">Download .vtf</button>
                        <button class="btn btn-outline-secondary" id="dlVmt">Download .vmt</button>
                        <button class="btn btn-outline-secondary" id="dlPngZip">Download 6 faces (.zip)</button>
                    </div>

                    <h3>.vmt</h3>
                    <pre id="vmtPreview"></pre>
                    <p class="note-text">Check the .vtf in VTFEdit before using it in-game.</p>
                </div>

            </div>
        </div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script crossorigin="anonymous" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../styles/script.js"></script>
        <script src="script.js"></script>
    </body>
</html>
