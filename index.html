<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIH Tools</title>
    <meta
      name="description"
      content="Browser-based tools for Source Engine and GMod: bump maps, cubemaps, normal maps, matcaps and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DIH Tools" />
    <meta property="og:description" content="Browser-based tools for Source Engine and GMod." />
    <meta property="og:image" content="https://diskinsidehead.github.io/img/icon.png" />
    <link rel="icon" type="image/x-icon" href="./styles/dih.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <link rel="stylesheet" href="./styles/index.css" />
  </head>
  <body>
    <div class="container animated-block text-center py-4">
      <div id="drop-area" class="d-flex align-items-center justify-content-center mb-4">
        <img src="./img/icon.png" alt="" class="rotating-icon me-4" width="40" height="40" />
        <h1 class="text-center m-0">DIH Tools</h1>
        <img src="./img/icon.png" alt="" class="rotating-icon ms-4" width="40" height="40" />
      </div>

      <div class="row gy-4">
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="bumpmap/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img src="./img/bump.jpg" class="card-img-top" alt="Bump map generator" loading="lazy" />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">BumpMap Generator</h5>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="cubemap/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img
                  src="./img/panorama.jpg"
                  class="card-img-top"
                  alt="Panorama to cubemap converter"
                  loading="lazy"
                />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">Panorama to CubeMap</h5>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="sourcetools/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img src="./img/source.jpg" class="card-img-top" alt="Auto VTA parser" loading="lazy" />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">Auto VTA Parser</h5>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="NoAutoDMXRules/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img
                  src="./img/NoAutoDMXRules.jpg"
                  class="card-img-top"
                  alt="DMX DmElement parser"
                  loading="lazy"
                />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">DMX DmElement Parser</h5>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="matcap2EnvMap/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img
                  src="./img/matcap2EnvMap.jpg"
                  class="card-img-top"
                  alt="Matcap to envmap converter"
                  loading="lazy"
                />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">Matcap to Envmap</h5>
              </div>
            </div>
          </a>
        </div>

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
          <a href="summnormals/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-image-container">
                <div class="placeholder-wave placeholder"></div>
                <img
                  src="./img/summnormals.jpg"
                  class="card-img-top"
                  alt="Normal maps combiner"
                  loading="lazy"
                />
              </div>
              <div class="card-body text-center">
                <h5 class="card-title">Normal Maps Combiner</h5>
              </div>
            </div>
          </a>
        </div>
      </div>

      <p class="mt-5 mb-0">
        <a href="https://github.com/DiskInsideHead" class="text-decoration-none">GitHub: DiskInsideHead</a>
      </p>
    </div>

    <script src="./styles/index.js"></script>
    <script src="./styles/script.js"></script>
  </body>
</html>
