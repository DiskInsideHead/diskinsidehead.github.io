<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Celestial Sandbox</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      const ALBUM_ID = "AhiiHfd";
      const CLIENT_ID = "c66c8c9fe60d2e1";
      const ALBUM_API = `https://api.imgur.com/3/album/${ALBUM_ID}/images`;
      const BLUR_URL = "https://i.imgur.com/fWIyegc.png";
      const LOGO_URL = "https://i.imgur.com/BAcwcXA.png";
      const SLIDE_INTERVAL_MS = 8000;

      function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
      }

      function createImage(src, className) {
        const img = document.createElement("img");
        img.src = src;
        img.classList.add(className);
        return img;
      }

      function startSlideshow(urls) {
        const container = document.createElement("div");
        container.classList.add("background-container");
        document.body.appendChild(container);

        container.appendChild(createImage(BLUR_URL, "background_blur"));

        urls.forEach((url, index) => {
          const img = createImage(url, "background");
          if (index === 0) img.classList.add("showing");
          container.appendChild(img);
        });

        container.appendChild(createImage(LOGO_URL, "logo"));

        const slides = container.querySelectorAll("img.background");
        let current = 0;
        setInterval(() => {
          slides[current].classList.remove("showing");
          current = (current + 1) % slides.length;
          slides[current].classList.add("showing");
        }, SLIDE_INTERVAL_MS);
      }

      fetch(ALBUM_API, { headers: { Authorization: `Client-ID ${CLIENT_ID}` } })
        .then((response) => {
          if (!response.ok) throw new Error(`Imgur API returned ${response.status}`);
          return response.json();
        })
        .then(({ data }) => {
          const urls = data.map((image) => image.link);
          shuffle(urls);
          startSlideshow(urls);
        })
        .catch((error) => console.error("Failed to load album:", error));
    </script>
  </body>
</html>
